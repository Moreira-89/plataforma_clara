name: CI

# Roda em PR e em push para main. O projeto não tem testes automatizados (decisão do dono),
# então o backend só passa pelo lint.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          # Fixado em 3.12 pelo mesmo motivo do Dockerfile: pandas 2.3.3 não
          # tem wheel para versões mais novas.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        # A configuração do ruff está no pyproject.toml da raiz do monorepo.
        run: ruff check ..
