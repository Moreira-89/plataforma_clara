name: CI

# Roda em PR e em push para main. A suíte é rápida (sem serviços externos),
# então não há necessidade de matriz de versões ou de cache agressivo.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend — lint e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          # Fixado em 3.12 pelo mesmo motivo do Dockerfile: pandas 2.3.3 não
          # tem wheel para versões mais novas.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        # A configuração do ruff está no pyproject.toml da raiz do monorepo.
        run: ruff check ..

      - name: Formatação (apenas código novo)
        # O código herdado ainda não passou por `ruff format` — reformatar tudo
        # agora produziria um diff enorme misturado com a reorganização.
        run: ruff format --check tests/

      - name: Testes
        # A suíte não toca em BigQuery, Groq nem Firebase: as dependências
        # externas são substituídas por fakes. Testes de integração ficam fora.
        run: pytest -m "not integracao"
