name: CI

# Roda em PR e em push para main. A suíte é rápida (sem serviços externos),
# então não há necessidade de matriz de versões ou de cache agressivo.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualidade:
    name: Lint e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          # Fixado em 3.12 pelo mesmo motivo do Dockerfile: pandas 2.3.3 não
          # tem wheel para versões mais novas.
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatação (apenas código novo)
        # O código legado ainda não passou por `ruff format` — reformatar tudo agora
        # produziria um diff enorme misturado com a migração. A checagem começa
        # restrita a tests/ e se expande conforme cada módulo é reescrito nas fases
        # seguintes do roadmap.
        run: ruff format --check tests/

      - name: Testes
        # A suíte não toca em Postgres, BigQuery nem Groq: as dependências externas
        # são substituídas por fakes. Testes marcados como "integracao" ficam de fora.
        run: pytest -m "not integracao"
