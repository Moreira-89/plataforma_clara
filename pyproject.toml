# Config do ruff para o repositório inteiro. O pytest fica em backend/pytest.ini.

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "node_modules", "frontend/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # linhas longas em prompts e queries
    "B008",  # chamada em default de argumento (padrão do Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
