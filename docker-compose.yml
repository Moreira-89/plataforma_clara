# Ambiente de desenvolvimento local: backend, frontend e Redis.
#
# O Postgres saiu do compose junto com a saída do Postgres da arquitetura. Os
# dados operacionais passam a viver no Firestore e no BigQuery, que são serviços
# gerenciados — em desenvolvimento se conecta neles direto, ou no emulador do
# Firebase quando ele entrar.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AMBIENTE: local
      REDIS_URL: redis://redis:6379/0
      # Credenciais externas vêm do .env local e nunca são versionadas.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      # Bind mount para hot reload: alteração no código reflete sem rebuild.
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        # Em desenvolvimento o browser fala com o backend na porta 8000 do host.
        VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    environment:
      PORT: 8080
    ports:
      - "5173:8080"
