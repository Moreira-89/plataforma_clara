# Ambiente de desenvolvimento local. Não vai para produção — ver docs/desenvolvimento.md.

services:
  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"   # servidor
      - "8001:8001"   # RedisInsight
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Sobrescrevem o .env: na rede do compose o Redis é 'redis', não localhost.
      AMBIENTE: local
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    # --reload só aqui; o CMD do Dockerfile é o de produção.
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        # O Vite embute a URL no bundle em tempo de build.
        VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    environment:
      PORT: 8080
    ports:
      - "5173:8080"

  docs:
    image: squidfunk/mkdocs-material:latest
    ports:
      - "8080:8000"
    volumes:
      - .:/docs

volumes:
  redis_data:
