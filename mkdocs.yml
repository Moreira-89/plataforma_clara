# Documentação do projeto.
#
# Rodar: `docker compose up docs` → http://localhost:8080
# Ou, com o mkdocs instalado: `mkdocs serve`
#
# O tema vem da imagem squidfunk/mkdocs-material usada no compose. Fora do
# container: `pip install mkdocs-material`. Ele não entra no requirements do
# backend de propósito — documentação não precisa ir junto na imagem da API.

site_name: Plataforma Clara
site_description: Transparência e análise de risco para FIDCs
docs_dir: docs

theme:
  name: material
  language: pt-BR
  palette:
    # Alterna claro/escuro pelo botão, respeitando a preferência do sistema.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Tema claro
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Início: index.md
  - Arquitetura: arquitetura.md
  - Desenvolvimento: desenvolvimento.md
  - Decisões: decisoes.md
  - O que falta: pendencias.md

markdown_extensions:
  - admonition          # blocos de aviso (!!! warning)
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details    # blocos recolhíveis
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: pt
