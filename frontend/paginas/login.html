<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/principal.css" />
    <link rel="stylesheet" href="/src/css/paginas/autenticacao.css" />
    <title>Entrar — Plataforma Clara</title>
  </head>
  <body>
    <header class="nav">
      <div class="container">
        <a class="marca" href="/">Clara<small>Plataforma</small></a>
        <div class="nav-acoes"><a class="btn btn-secundario" href="/paginas/cadastro.html">Criar conta</a></div>
      </div>
    </header>
    <main class="auth">
      <section class="cartao auth-cartao">
        <h1>Entrar</h1>
        <p>Acesse com o e-mail e a senha da sua conta.</p>
        <form id="form-login" class="formulario" novalidate>
          <label class="campo">E-mail
            <input name="email" type="email" required autocomplete="username" />
          </label>
          <label class="campo">Senha
            <input name="senha" type="password" required autocomplete="current-password" />
          </label>
          <p id="mensagem" class="mensagem" role="status"></p>
          <button class="btn btn-primario btn-bloco" type="submit">Entrar</button>
        </form>
        <p class="auth-rodape">Ainda não tem conta? <a class="btn-texto" href="/paginas/cadastro.html">Cadastre-se como investidor</a></p>
      </section>
    </main>
    <script type="module" src="/src/js/paginas/login.js"></script>
  </body>
</html>
