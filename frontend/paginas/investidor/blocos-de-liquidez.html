<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/principal.css" />
    <link rel="stylesheet" href="/src/css/paginas/blocos.css" />
    <title>Blocos de Liquidez — Plataforma Clara</title>
  </head>
  <body data-perfil="investidor" class="com-menu">
    <aside id="menu"></aside>

    <main class="pagina-blocos" id="conteudo" hidden>
      <span class="rotulo">Investidor</span>
      <h1 class="titulo-pagina">Blocos de Liquidez</h1>
      <p>Escolha um bloco para ver as empresas, o vencimento e o risco de cada uma.</p>

      <div class="barra-blocos">
        <input id="busca" type="search" placeholder="Buscar por código ou etiqueta" autocomplete="off" aria-label="Buscar bloco" />
        <label class="ordem">
          <span class="so-leitor">Ordenar por</span>
          <select id="ordem" aria-label="Ordenar blocos">
            <option value="recentes">Mais recentes</option>
            <option value="score">Maior score</option>
          </select>
        </label>
        <button class="btn btn-secundario" id="ver-tudo" type="button">Ver tudo</button>
      </div>

      <p id="estado" class="mensagem" role="status"></p>
      <section id="cartoes" class="grade-blocos" aria-live="polite"></section>
    </main>

    <dialog id="detalhe" class="detalhe-bloco" aria-labelledby="detalhe-titulo">
      <div class="detalhe-topo">
        <h2 id="detalhe-titulo"></h2>
        <button class="detalhe-fechar" id="detalhe-fechar" type="button" aria-label="Fechar">×</button>
      </div>
      <div id="detalhe-corpo"></div>
    </dialog>
    <script type="module" src="/src/js/paginas/blocos/lista.js"></script>
  </body>
</html>
