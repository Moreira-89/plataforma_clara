<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/css/principal.css" />
    <link rel="stylesheet" href="/src/css/paginas/blocos.css" />
    <link rel="stylesheet" href="/src/css/paginas/blocos-investidos.css" />
    <title>Blocos Investidos — Plataforma Clara</title>
  </head>
  <body data-perfil="investidor" class="com-menu">
    <aside id="menu"></aside>

    <main class="pagina-blocos" id="conteudo" hidden>
      <span class="rotulo">Investidor</span>
      <h1 class="titulo-pagina">Blocos Investidos</h1>
      <p>Os blocos em que você já investiu, agrupados por pedra, do mais recente para o mais antigo.</p>

      <p id="estado" class="mensagem" role="status"></p>
      <div id="filtro" class="filtro-etiqueta" hidden>
        <span id="filtro-texto"></span>
        <button class="btn btn-secundario" id="filtro-limpar" type="button">Limpar filtro</button>
      </div>
      <div id="grupos" aria-live="polite"></div>
    </main>
    <dialog id="detalhe" class="detalhe-bloco" aria-labelledby="detalhe-titulo">
      <div class="detalhe-topo">
        <h2 id="detalhe-titulo"></h2>
        <button class="detalhe-fechar" id="detalhe-fechar" type="button" aria-label="Fechar">×</button>
      </div>
      <div id="detalhe-corpo"></div>
    </dialog>
    <script type="module" src="/src/js/paginas/investidor/blocos-investidos.js"></script>
  </body>
</html>
