# Configuração do pytest do backend. Fica aqui, e não na raiz do monorepo, porque
# a suíte é do serviço de backend — o frontend tem a sua própria.
[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
addopts = --strict-markers --strict-config -ra
markers =
    integracao: exige serviços externos (BigQuery, Groq, Firebase). Fora da CI por padrão.
filterwarnings =
    ignore::DeprecationWarning
